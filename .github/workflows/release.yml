name: 多架构跨平台构建与发布

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (原生 Ubuntu)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: codex_quota_companion
            archive_name: codex-quota-companion-linux-x86_64-gnu
            use_cross: false

          # Linux aarch64 (ARM64 树莓派 / 嵌入式开发板)
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            binary_name: codex_quota_companion
            archive_name: codex-quota-companion-linux-aarch64-gnu
            use_cross: true

          # Windows x86_64 (标准 64 位 PC)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: codex_quota_companion.exe
            archive_name: codex-quota-companion-windows-x86_64
            use_cross: false

          # Windows aarch64 (高通骁龙 Windows on ARM / Surface Pro)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: codex_quota_companion.exe
            archive_name: codex-quota-companion-windows-arm64
            use_cross: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 cross (仅交叉编译 Linux arm64)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: 编译 Release 二进制 (跨平台)
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin codex_quota_companion
          else
            cargo build --release --target ${{ matrix.target }} --bin codex_quota_companion
          fi
        shell: bash

      - name: 打包二进制资产 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" dist/
          cp README.md .env.example LICENSE dist/
          tar -czf "${{ matrix.archive_name }}.tar.gz" -C dist .
          sha256sum "${{ matrix.archive_name }}.tar.gz" > "${{ matrix.archive_name }}.tar.gz.sha256"

      - name: 打包二进制资产 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" dist/
          cp README.md .env.example LICENSE dist/
          7z a "${{ matrix.archive_name }}.zip" ./dist/*
          certutil -hashfile "${{ matrix.archive_name }}.zip" SHA256 | grep -v ":" | tr -d " \r\n" | awk '{print $1 "  ${{ matrix.archive_name }}.zip"}' > "${{ matrix.archive_name }}.zip.sha256"

      - name: 暂存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            ${{ matrix.archive_name }}.tar.gz*
            ${{ matrix.archive_name }}.zip*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部平台编译成果
        uses: actions/download-artifact@v4
        with:
          path: all_dist
          merge-multiple: true

      - name: 发布全平台 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la all_dist/
          gh release create "$GITHUB_REF_NAME" all_dist/* --verify-tag --generate-notes
