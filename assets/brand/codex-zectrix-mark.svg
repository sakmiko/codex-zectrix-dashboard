<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Codex Dashboard for ZECTRIX logo</title>
  <desc id="desc">A warm e-paper status panel with a geometric C and a single changed-frame indicator.</desc>
  <defs>
    <linearGradient id="shell" x1="96" y1="54" x2="420" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F0E8"/>
      <stop offset="1" stop-color="#D8D4C9"/>
    </linearGradient>
    <linearGradient id="screen" x1="120" y1="96" x2="392" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252521"/>
      <stop offset="1" stop-color="#11110F"/>
    </linearGradient>
    <filter id="shadow" x="20" y="26" width="472" height="478" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#11110F" flood-opacity=".16"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="56" y="46" width="400" height="416" rx="66" fill="url(#shell)"/>
    <rect x="57" y="47" width="398" height="414" rx="65" fill="none" stroke="#FFFEF9" stroke-opacity=".72" stroke-width="2"/>
  </g>

  <rect x="88" y="82" width="336" height="304" rx="34" fill="#A9A59B"/>
  <rect x="94" y="88" width="324" height="292" rx="29" fill="url(#screen)"/>
  <path d="M334 140H166V328H334V282H214V186H334V140Z" fill="#FFFEF9"/>

  <circle cx="374" cy="424" r="18" fill="#C3BFB5"/>
  <circle cx="374" cy="422" r="12" fill="#C45B43"/>
  <path d="M365 417C368 412 377 409 383 415" fill="none" stroke="#F19B82" stroke-linecap="round" stroke-width="3" opacity=".7"/>
</svg>
