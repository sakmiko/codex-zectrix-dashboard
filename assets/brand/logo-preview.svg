  <text x="637" y="665" fill="#64625C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">MONO / E-INK</text>

  <rect x="882" y="452" width="254" height="242" rx="28" fill="#D8D4C9"/>
  <g transform="translate(915 492)">
    <image href="codex-zectrix-mark.svg" width="96" height="96"/>
    <image href="codex-zectrix-mark.svg" x="118" y="16" width="64" height="64"/>
